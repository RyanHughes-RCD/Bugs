<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a1c2c">
  <title>Bug Garden</title>
  <link rel="icon" href="8x/ladybug.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="stage">
      <canvas id="garden" aria-label="Your garden"></canvas>
      <div id="hud"></div>
      <section id="sheet" aria-live="polite">
        <div class="sheet-head"><h2 id="sheet-title"></h2><button class="modal-x" data-act="nav" data-panel="garden" aria-label="Back to garden">×</button></div>
        <div id="sheet-body"></div>
      </section>
    </main>
    <nav id="nav"></nav>
    <div id="modal-root"></div>
    <div id="toasts"></div>
    <div id="loading">
      <img class="px" src="8x/ladybug.png" alt="">
      <h1>Bug Garden</h1>
      <div class="bar"><i></i></div>
      <p>Waking up the bugs...</p>
    </div>
  </div>
  <script type="module" src="game/js/main.js"></script>
</body>
</html>
