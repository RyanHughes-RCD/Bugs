<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a1c2c">
  <title>Bug Garden</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bug Garden">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="stage">
      <canvas id="garden" aria-label="Your garden"></canvas>
      <div id="hud"></div>
      <div id="quick" hidden></div>
      <section id="sheet" aria-live="polite">
        <div class="sheet-head"><h2 id="sheet-title"></h2><button class="modal-x" data-act="nav" data-panel="garden" aria-label="Back to garden">×</button></div>
        <div id="sheet-body"></div>
      </section>
    </main>
    <nav id="nav"></nav>
    <div id="modal-root"></div>
    <div id="toasts"></div>
    <div id="loading" aria-label="Loading Bug Garden">
      <!-- Pink fills up from the bottom, behind the art, so its cut-outs turn pink as the game loads. -->
      <div class="load-fill"></div>
      <img class="load-art" src="loading.png" alt="" onload="this.parentNode.classList.add('ready')">
      <p></p>
    </div>
  </div>
  <script type="module" src="game/js/main.js"></script>
</body>
</html>
